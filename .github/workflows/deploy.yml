name: Build, Push to Docker Hub and Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Push mới lên main thì huỷ lần deploy cũ đang chạy, chỉ deploy bản mới nhất
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Chặn "Run workflow" từ branch khác main deploy đè lên prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Test fail thì dừng luôn, không build image / không deploy
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: sh ./mvnw -B test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tên image Docker bắt buộc chữ thường (secret có thể ghi "Tinhhhh")
      - name: Image name
        run: echo "IMAGE=$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')/sos-vietnam" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy lên VPS: ssh vào và chạy /opt/sos/deploy-service.sh be <sha> (kéo image mới, khởi động lại, đợi BE trả lời được)
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes "root@$VPS_HOST" "/opt/sos/deploy-service.sh be ${{ github.sha }}"
