spring.application.name=sos-vietnam-backend
# Local secrets (DB password, JWT secret, R2 keys) live in the git-ignored .env file next to pom.xml; see .env.example
spring.config.import=optional:file:.env[.properties]

#Server Configuration
server.port=8080
server.forward-headers-strategy=framework

#DB Configuration
# Password comes from DB_PASSWORD in .env; URL/user can be overridden there too (DB_URL, DB_USERNAME)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sos-vietnam-2026-db}
spring.datasource.username=${DB_USERNAME:sos_vietnam_db_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Schema do Flyway quản lý (db/migration/V*__*.sql); Hibernate chỉ kiểm tra entity khớp với bảng
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# DB đã có sẵn bảng (trước Flyway): đánh dấu V1 là đã chạy rồi chạy tiếp V2+
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Run schema.sql (enables PostGIS) on every start, before Hibernate creates the geometry tables
spring.sql.init.mode=never
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=WARN
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Gom các lần nạp quan hệ (tỉnh/xã của ca, tài khoản...) thành IN (...) thay vì 1 SELECT mỗi dòng
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

#JWT Configuration
# Signing secret comes from JWT_SECRET in .env (never commit it); the app refuses to start without it.
app.jwt.secret-key=${JWT_SECRET:}
# 1 day
app.jwt-access-expiration-milliseconds=86400000
# 7 days
app.jwt-refresh-expiration-milliseconds=604800000
# Alias compatibility
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

#Redis: keeps revoked tokens and "log out everywhere" marks across restarts (TokenRevocationStore).
# REDIS_URL in .env, e.g. redis://default:<password>@<host>:<port> (rediss:// for TLS).
# Empty = memory only; the localhost default is never contacted then.
app.redis.url=${REDIS_URL:}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=3s
spring.data.redis.repositories.enabled=false

#Default accounts (DataSeeder): created only when the password is set in .env
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.test-account-password=${SEED_TEST_ACCOUNT_PASSWORD:}
# PIN của mọi cán bộ do UnitAccountSeeder tạo (demo); trống = không seed tài khoản đơn vị
app.seed.member-pin=${SEED_MEMBER_PIN:}

#Swagger Configuration
# SWAGGER_ENABLED=false trên VPS: không công khai bản đồ API
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

#Incident media upload (<= 5 images x 10MB + 1 video x 20MB, checked again in IncidentServiceImpl)
spring.servlet.multipart.max-file-size=21MB
spring.servlet.multipart.max-request-size=75MB

#Media storage: local = folder app.upload-dir | r2 = Cloudflare R2 bucket
app.storage.provider=${STORAGE_PROVIDER:local}
app.upload-dir=uploads
app.storage.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket=${R2_BUCKET:sos-vietnam-media}
# How long a signed link to a photo/video stays valid
app.storage.r2.presign-ttl=10m

#Bando GIS Sync
app.bando.sync-cron=0 0 */6 * * *
app.bando.source-url=https://sapnhap.bando.com.vn

#CORS: web pages allowed to call the API and open the STOMP WebSocket (comma-separated, patterns allowed).
#Override with CORS_ALLOWED_ORIGINS in .env / Render env when the FE domain changes.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:*,https://sos-vietnam-fe-latest.onrender.com}

#Incident queue: a ward-level police incident nobody accepts within this many minutes moves to the province
app.incident.escalation-minutes=15
# Ca chờ quá số phút này mà chưa ai nhận thì tự huỷ lúc BE khởi động (lý do NO_RESPONDER)
app.incident.auto-cancel-minutes=60
# Ca mở tạo trong khoảng này mới tính vào giới hạn 2 ca mở / số điện thoại (ca cũ hơn coi là bỏ dở)
app.incident.resume-hours=24
# Ca VERIFYING mà cán bộ giữ ca mất kết nối quá số phút này thì tự trả về hàng đợi
app.incident.offline-release-minutes=3
# CHỈ ĐỂ TEST: luôn giữ 1 ca test [DEMO] cho congan.tanan / congan.cantho / csgt.cantho (config/DemoIncidentSeeder).
# DEMO_INCIDENTS = giá trị mặc định; bật / tắt lúc chạy ở Cài đặt > Ca demo (bảng app_settings, thắng .env).
# Ca test đã điều động quá N phút thì tự đóng rồi tạo lại.
app.demo.incidents.enabled=${DEMO_INCIDENTS:false}
app.demo.incidents.resolving-minutes=${DEMO_INCIDENTS_RESOLVING_MINUTES:30}
# Video call: TURN của Cloudflare (Realtime > TURN). Để trống = chỉ STUN (wifi thường đủ, 4G có thể không nối được)
app.turn.cloudflare.key-id=${CLOUDFLARE_TURN_KEY_ID:}
app.turn.cloudflare.api-token=${CLOUDFLARE_TURN_API_TOKEN:}
app.turn.ttl-seconds=3600
# Theo dõi xe điều động: Traccar đẩy điểm GPS sang POST /internal/traccar/positions kèm header X-Traccar-Secret.
# Trống = từ chối mọi điểm (401)
app.traccar.forward-secret=${TRACCAR_FORWARD_SECRET:}
# Nút "Mô phỏng di chuyển" (ca demo): gửi điểm giả vào cổng OsmAnd của Traccar như app trên điện thoại.
# Trên VPS: http://traccar:5055/ (mạng Docker). Trống (local) = đưa thẳng vào BE, không qua Traccar
app.traccar.osmand-url=${TRACCAR_OSMAND_URL:}
app.traccar.simulation.speed-kmh=50
app.traccar.simulation.interval-seconds=5
# SMS link người phụ trách hiện trường: app "SMS Gateway for Android" chế độ Cloud trên điện thoại cắm SIM (eSIM được).
# Username / Password hiện trong app sau khi bấm Start. Trống = không gửi (chỉ hiện link để sao chép)
app.sms.gateway.url=${SMS_GATEWAY_URL:https://api.sms-gate.app/3rdparty/v1}
app.sms.gateway.username=${SMS_GATEWAY_USERNAME:}
app.sms.gateway.password=${SMS_GATEWAY_PASSWORD:}
# Máy 2 SIM: khe gửi 1-3, trống = SIM mặc định
app.sms.gateway.sim=${SMS_GATEWAY_SIM:}
app.sms.gateway.ttl-seconds=900
# >= 100: app SMS Gateway gửi ngay, bỏ qua khoảng nghỉ / giới hạn tốc độ trong app; 0 = không gửi trường priority
app.sms.gateway.priority=100
# Địa chỉ trang web ghép vào link trong SMS (VPS: https://sosvie.site)
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}
# SMS "đã tiếp nhận" + mã ca cho người báo tin (docs/spec-multi-case.md): gửi sau N giây kể từ lúc nhận ca (huỷ / báo
# khống trong lúc đó thì thôi), tối đa M tin / số / 24 giờ
app.sms.received-delay-seconds=10
app.sms.max-per-phone-per-day=20
# SMS "lực lượng sắp tới" cho người báo tin: GPS người đi cách điểm đến <= N m (1 lần / lượt)
app.sms.approach-distance-m=50

#Weather (header of the officer console), cached 10 minutes in WeatherServiceImpl
app.weather.source-url=https://api.open-meteo.com

#Gzip JSON responses (GET /api/v1/stations returns ~3.7k stations)
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2KB

#Logging
logging.level.com.sosvietnam=INFO