spring.application.name=sos-vietnam-backend
# Local secrets (DB password, JWT secret, R2 keys) live in the git-ignored .env file next to pom.xml; see .env.example
spring.config.import=optional:file:.env[.properties]

#Server Configuration
server.port=8080
server.forward-headers-strategy=framework

#DB Configuration
# Password comes from DB_PASSWORD in .env; URL/user can be overridden there too (DB_URL, DB_USERNAME)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sos-vietnam-2026-db}
spring.datasource.username=${DB_USERNAME:sos_vietnam_db_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# Run schema.sql (enables PostGIS) on every start, before Hibernate creates the geometry tables
spring.sql.init.mode=always
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=WARN
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

#JWT Configuration
# Signing secret comes from JWT_SECRET in .env (never commit it); the app refuses to start without it.
app.jwt.secret-key=${JWT_SECRET:}
# 1 day
app.jwt-access-expiration-milliseconds=86400000
# 7 days
app.jwt-refresh-expiration-milliseconds=604800000
# Alias compatibility
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

#Default accounts (DataSeeder): created only when the password is set in .env
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.dispatcher-password=${SEED_DISPATCHER_PASSWORD:}

#Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

#Incident media upload (images <= 10MB, videos <= 15MB, checked again in IncidentServiceImpl)
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=60MB

#Media storage: local = folder app.upload-dir | r2 = Cloudflare R2 bucket
app.storage.provider=${STORAGE_PROVIDER:local}
app.upload-dir=uploads
app.storage.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket=${R2_BUCKET:sos-vietnam-media}
# How long a signed link to a photo/video stays valid
app.storage.r2.presign-ttl=10m

#Bando GIS Sync
app.bando.sync-cron=0 0 */6 * * *
app.bando.source-url=https://sapnhap.bando.com.vn

#Logging
logging.level.com.sosvietnam=INFO